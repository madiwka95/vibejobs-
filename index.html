function chips(){
  $("chips").innerHTML = `<div class="chip${!activeStack?' on':''}" data-s="">всё</div>` +
    STACKS.map(s=>`<div class="chip${activeStack===s?' on':''}" data-s="${s}">${s}</div>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeStack=c.dataset.s;chips();load();});
}
function fmtSal(j){
  if(!j.salary_from && !j.salary_to) return "зарплата не указана";
  const f = j.salary_from? j.salary_from.toLocaleString("ru-RU"):"…";
  const t = j.salary_to? j.salary_to.toLocaleString("ru-RU"):"…";
  return `${f} – ${t} ${j.currency||""}`;
}
function scoreCls(s){ return s>=70?"hi": s>=45?"mid":"lo"; }
function filterLocal(jobs){
  const text = ($("f").value||"").toLowerCase();
  const stack = (activeStack||"").toLowerCase();
  const remote = $("remote").checked, junior = $("junior").checked;
  const source = $("src").value, sort = $("sort").value, favonly = $("favonly").checked;
  return jobs.filter(j=>{
    if(stack){
      const hay = (" "+[...(j.stack_tags||[]), j.title||"", j.desc||""].join(" ")+" ").toLowerCase();
      if(!hay.includes(stack)) return false;
    }
    if(remote && !j.remote) return false;
    if(junior && !j.junior) return false;
    if(source && j.source!==source) return false;
    const salm = salVal();
    if(salm){ const top = Math.max(j.salary_from||0, j.salary_to||0); if(top < salm) return false; }
    if(text && !((j.title||"")+" "+(j.company||"")+" "+(j.desc||"")).toLowerCase().includes(text)) return false;
    if(favonly && !favs.has(j.id)) return false;
    return true;
  }).sort((a,b)=> sort==="fresh"
    ? String(b.published||"").localeCompare(String(a.published||""))
    : (b.vibe_score||0)-(a.vibe_score||0));
}
function ava(name){
  const s = ((name||"?").trim()||"?");
  const ch = s[0].toUpperCase();
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 360; }
  return `<span class="ava" style="background:hsl(${h},55%,45%)">${ch}</span>`;
}
function srcBadge(s){
  const m = {"hh.ru":"src-hh", "habr":"src-habr", "telegram":"src-tg"};
  return `<span class="src ${m[s]||""}">${s||""}</span>`;
}
function cardHTML(j){
  const ap = applied[j.id];
  let h = `<div class="card${j.vibe_score>=75?' top':''}">`;
  h += `<div class="chead">${ava(j.company)}<h3><a href="${j.url}" target="_blank" rel="noopener">${j.title||"Без названия"}</a></h3></div>`;
  h += `<div class="meta"><span>${j.company||""}</span><span>•</span><span>${j.city||"—"}</span>${j.remote?'<span>• 🏠 удалённо</span>':''} ${srcBadge(j.source)}</div>`;
  h += `<div class="sal">${fmtSal(j)}</div>`;
  h += `<div class="tags">${(j.stack_tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}${j.junior?'<span class="tag">junior-friendly</span>':''}</div>`;
  h += `<div class="score ${scoreCls(j.vibe_score)}">вайбовость: ${j.vibe_score}/100</div>`;
  h += `<div class="why">${(j.vibe_reasons||[]).slice(0,3).join(" · ")}</div>`;
  if(ap){ h += `<div class="why">📋 отклик: ${ap.date} (<a href="#" data-unapply="${j.id}">убрать</a>)</div>`; }
  h += `<div class="row"><button class="ghost${favs.has(j.id)?' saved':''}" data-fav="${j.id}">${favs.has(j.id)?"★ в избранном":"☆ в избранное"}</button>`;
  h += `<button class="ghost" data-apply="${j.id}">${ap?"✓ Откликнуто":"✓ Откликнулся"}</button>`;
  h += `<button data-cover="${j.id}">✨ Отклик</button></div></div>`;
  return h;
}
function render(jobs, note, emptyText){

  $("status").textContent = note;

function bindCards(){
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    const id = b.getAttribute("data-fav");
    if(favs.has(id)){ favs.delete(id); }else{ favs.add(id); }
    store.set("vibejobs_fav", Array.from(favs));
    load();
  });
  document.querySelectorAll("[data-apply]").forEach(b=>b.onclick=()=>toggleApply(b.getAttribute("data-apply")));
  document.querySelectorAll("[data-cover]").forEach(b=>b.onclick=()=>openCover(b.getAttribute("data-cover")));
  document.querySelectorAll("[data-unapply]").forEach(a=>a.onclick=e=>{ e.preventDefault(); toggleApply(a.getAttribute("data-unapply")); });
}
function toggleApply(id){
  if(applied[id]){ delete applied[id]; }
  else{
    const j = lastJobs.find(x=>x.id===id);
    if(!j) return;
    applied[id] = {title:j.title, company:j.company, url:j.url,
      date:new Date().toISOString().slice(0,10),
      vibe:j.vibe_score||0, remote:!!j.remote};
  }
  store.set("vibejobs_applied", applied);
  load();
}
function renderApplied(){
  const ids = Object.keys(applied);
  const jobs = ids.map(id=>Object.assign(
    {id:id, stack_tags:[], vibe_score:50, vibe_reasons:[], junior:false,
     remote:false, city:"", source:"", desc:"", published:"",
     salary_from:null, salary_to:null, currency:"RUR"},
    applied[id]));
  render(jobs, `📋 Мои отклики: ${jobs.length} • хранятся в этом браузере`);
}
async function load(){
  if($("apponly").checked){ renderApplied(); return; }
  const q = $("q").value || "python junior";
  const favonly = $("favonly").checked;
  $("status").textContent = "Ищу вакансии…";
  // 1. Пробуем живой бэкенд (если страница открыта через сервер).
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), API_TIMEOUT);
    let r;
    try{
      r = await fetch("/api/jobs?"+new URLSearchParams({
        q, text:$("f").value||"", stack:activeStack,
        remote:$("remote").checked?"1":"", junior:$("junior").checked?"1":"",
        source:$("src").value, sort:$("sort").value, salary_min:String(salVal()||"")
      }), {signal:ctl.signal});
    } finally { clearTimeout(t); }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    let jobs = d.jobs||[];
    if(favonly) jobs = jobs.filter(j=>favs.has(j.id));
    render(jobs, `Найдено: ${jobs.length} (запрос «${d.query}», свежие данные) • ★ — в избранное`);
    return;
  }catch(e){ /* сервера нет — показываем вшитый слепок ниже */ }
  // 2. Сервера нет (страница открыта файлом): вшитый слепок реальных вакансий.
  if(SNAPSHOT && SNAPSHOT.jobs && SNAPSHOT.jobs.length){
    const jobs = filterLocal(SNAPSHOT.jobs);
    render(jobs, `Найдено: ${jobs.length} • сохранённые вакансии от ${SNAPSHOT.date}. Для самых свежих запусти start.bat и нажми «Найти».`);
    return;
  }
  // 3. Нет ни сервера, ни слепка.
  render([], "Вакансии не загрузились",
    "Нет соединения с сервером и нет сохранённых вакансий. Запусти start.bat в папке vibe-jobs (он сам откроет сайт), либо вручную: python app.py → http://localhost:8000.");
}

});

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(t); }
  return new Promise((res, rej)=>{
    const ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); res(); }catch(e){ rej(e); }
    ta.remove();
  });
}

  $("coverHint").textContent = "Генерирую через AI…";
  const prompt = "Напиши короткий отклик на вакансию (5-8 предложений, русский язык). "
    +"Вакансия: "+coverJob.title+". Компания: "+(coverJob.company||"")+". "
    +"Стек: "+((coverJob.stack_tags||[]).join(", ")||"—")+". "
    +(coverJob.remote?"Формат: удалённо. ":"")+"Соискатель: "+($("myname").value||"разработчик")+". "
    +"Без воды, конкретно под эту вакансию.";
  try{
    const r = await fetch(base+"/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer "+key},
      body:JSON.stringify({model:"gpt-4o-mini", messages:[{role:"user", content:prompt}], temperature:0.7})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    const txt = d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : "";
    if(!txt) throw new Error("пустой ответ");
    $("coverText").value = txt.trim();
    $("coverHint").textContent = "Готово — проверь текст и копируй.";
  }catch(e){ $("coverHint").textContent = "AI не ответил ("+e+"). Проверь ключ и URL — или используй шаблон выше."; }
};
initTheme();
chips(); load();
</script>
</body>
</html>
